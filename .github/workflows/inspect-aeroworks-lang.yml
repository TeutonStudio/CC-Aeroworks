name: Inspect Aeroworks languages

on:
  push:
    branches:
      - agent/ingame-api-wiki-ponder

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Aeroworks 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/aeroworks-1.3.0.jar \
            'https://cdn.modrinth.com/data/P26k79kP/versions/EYVmBa7H/aeroworks-1.3.0.jar'

      - name: Print language resources
        shell: bash
        run: |
          set -euo pipefail
          unzip -l /tmp/aeroworks-1.3.0.jar 'assets/aeroworks/lang/*'
          for language in en_us de_de zh_cn ru_ru; do
            path="assets/aeroworks/lang/${language}.json"
            echo "===== ${path} ====="
            if unzip -Z1 /tmp/aeroworks-1.3.0.jar | grep -Fxq "${path}"; then
              unzip -p /tmp/aeroworks-1.3.0.jar "${path}"
              echo
            else
              echo '<missing>'
            fi
          done
