name: Publish v1.3.0

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - master

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: publish-v1.3.0
  cancel-in-progress: true

jobs:
  publish:
    name: Publish verified v1.3.0 artifact
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 46 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TARGET: 4573750b12223f5180775a7dd2313cc131421eb4
      RELEASE_TAG: v1.3.0
      SOURCE_RUN_ID: "32165778287"
      EVIDENCE_NAME: cc-aeroworks-v1.3.0-release-evidence
      EXPECTED_JAR_SHA256: 5ca64607e4e8d08c561b1e1540c1c379a5e168f0a667ff6075bf75d5b83828bf
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Report publication start
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(printf '### v1.3.0 protected publication\n\nStatus: **started**\nRelease target: `%s`\nSource evidence run: `%s`\nExpected JAR SHA-256: `%s`' "${RELEASE_TARGET}" "${SOURCE_RUN_ID}" "${EXPECTED_JAR_SHA256}")
          gh issue comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "${body}"

      - name: Stop if v1.3.0 already exists
        id: existing
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${RELEASE_TAG} already exists; leaving it untouched."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download verified release evidence
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${EVIDENCE_NAME}" \
            --dir release-evidence
          find release-evidence -maxdepth 4 -type f -print | sort

      - name: Verify exact tested artifact and evidence
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find release-evidence -type f -name 'cc-aeroworks-1.3.0.jar' -print -quit)"
          result_path="$(find release-evidence -type f -name 'base-server.json' -print -quit)"
          metadata_path="$(find release-evidence -type f -name 'release-neoforge.mods.toml' -print -quit)"
          notes_path="$(find release-evidence -type f -name 'release-notes-v1.3.0.md' -print -quit)"

          test -n "${jar_path}" && test -f "${jar_path}"
          test -n "${result_path}" && test -f "${result_path}"
          test -n "${metadata_path}" && test -f "${metadata_path}"
          test -n "${notes_path}" && test -f "${notes_path}"

          printf '%s  %s\n' "${EXPECTED_JAR_SHA256}" "${jar_path}" | sha256sum --check --strict -

          python3 - "${result_path}" "${RELEASE_TARGET}" <<'PY'
          import json
          import sys

          path, expected_commit = sys.argv[1:]
          result = json.load(open(path, encoding="utf-8"))
          assert result.get("status") == "PASS", result
          assert result.get("profile") == "BASE-SERVER", result
          assert result.get("commit") == expected_commit, result
          steps = result.get("steps", [])
          assert len(steps) >= 3, result
          assert all(step.get("exitCode") == 0 for step in steps), result
          print(f"Verified BASE-SERVER PASS for {expected_commit}")
          PY

          grep -F 'modId="cc_aeroworks"' "${metadata_path}"
          grep -F 'modId="cc_aeroworks_radarcompat"' "${metadata_path}"
          test "$(grep -Fc 'version="1.3.0"' "${metadata_path}")" -ge 2
          grep -A3 -F 'modId="sable"' "${metadata_path}" | grep -F 'type="required"'

          cp "${jar_path}" ./cc-aeroworks-1.3.0.jar
          printf '%s  cc-aeroworks-1.3.0.jar\n' "${EXPECTED_JAR_SHA256}" > ./cc-aeroworks-1.3.0.jar.sha256
          cp "${result_path}" ./base-server.json
          cp "${metadata_path}" ./release-neoforge.mods.toml
          cp "${notes_path}" ./release-notes-v1.3.0.md

      - name: Publish v1.3.0 GitHub release
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "cc-aeroworks-1.3.0.jar#CC-Aeroworks v1.3.0" \
            "cc-aeroworks-1.3.0.jar.sha256#SHA-256" \
            "base-server.json#BASE-SERVER verification result" \
            "release-neoforge.mods.toml#Generated NeoForge metadata" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_TARGET}" \
            --title "CC-Aeroworks v1.3.0" \
            --notes-file release-notes-v1.3.0.md \
            --latest

      - name: Verify published tag and release
        shell: bash
        run: |
          set -euo pipefail
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "${release_target}" = "${RELEASE_TARGET}"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,name,isDraft,isPrerelease,url

      - name: Report publication result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            state="published"
          else
            state="not published"
          fi
          body=$(printf '### v1.3.0 protected publication\n\nStatus: **%s**\nWorkflow job: **%s**\nRelease target: `%s`\nSource evidence run: `%s`\nExpected JAR SHA-256: `%s`' "${state}" "${JOB_STATUS}" "${RELEASE_TARGET}" "${SOURCE_RUN_ID}" "${EXPECTED_JAR_SHA256}")
          gh issue comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
