name: Inspect Aeroworks interactions

on:
  push:
    branches:
      - agent/restore-control-interactions
  pull_request:
    paths:
      - .github/workflows/inspect-aeroworks-interactions.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Aeroworks 1.3.0
        run: |
          curl --fail --location --retry 3 \
            --output aeroworks.jar \
            https://cdn.modrinth.com/data/P26k79kP/versions/EYVmBa7H/aeroworks-1.3.0.jar
      - name: Print relevant interaction bytecode
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            class_name="${entry%.class}"
            class_name="${class_name//\//.}"
            output="$(javap -classpath aeroworks.jar -p -c "$class_name" 2>/dev/null || true)"
            matches="$(grep -n -B 10 -A 28 -E 'isShiftKeyDown|isCrouching|openMenu|ModuleMenu' <<<"$output" || true)"
            if [[ -n "$matches" ]]; then
              echo "===== $class_name ====="
              printf '%s\n' "$matches" | head -n 180
            fi
          done < <(
            jar tf aeroworks.jar \
              | grep '^com/mred231/aeroworks/content/controls/.*\.class$' \
              | grep -v '\$' \
              | sort
          )
