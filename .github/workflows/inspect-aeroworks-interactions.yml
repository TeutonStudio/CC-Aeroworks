name: Inspect Aeroworks interactions

on:
  push:
    branches:
      - agent/restore-control-interactions
  pull_request:
    paths:
      - .github/workflows/inspect-aeroworks-interactions.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Aeroworks 1.3.0
        run: |
          curl --fail --location --retry 3 \
            --output aeroworks.jar \
            https://cdn.modrinth.com/data/P26k79kP/versions/EYVmBa7H/aeroworks-1.3.0.jar
          sha256sum aeroworks.jar
      - name: List control classes
        run: jar tf aeroworks.jar | grep 'com/mred231/aeroworks/content/controls' | sort
      - name: Inspect ConsoleDeskBlock
        run: javap -classpath aeroworks.jar -p -c -s com.mred231.aeroworks.content.controls.ConsoleDeskBlock
      - name: Inspect ConsoleBlockEntity
        run: javap -classpath aeroworks.jar -p -c -s com.mred231.aeroworks.content.controls.ConsoleBlockEntity
      - name: Inspect module menu classes
        run: |
          javap -classpath aeroworks.jar -p -c -s com.mred231.aeroworks.content.controls.ModuleItem
          javap -classpath aeroworks.jar -p -c -s com.mred231.aeroworks.content.controls.ModuleMenu
          javap -classpath aeroworks.jar -p -c -s com.mred231.aeroworks.content.controls.MountedModule
