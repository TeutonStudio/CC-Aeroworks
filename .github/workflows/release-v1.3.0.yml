name: Publish v1.3.0

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-v1.3.0.yml"
  pull_request:
    branches:
      - master
    paths:
      - ".github/release/v1.3.0.trigger"

permissions:
  contents: write

concurrency:
  group: publish-v1.3.0
  cancel-in-progress: true

jobs:
  release:
    name: Build, verify and publish v1.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TARGET: 4573750b12223f5180775a7dd2313cc131421eb4
      RELEASE_TAG: v1.3.0
      MOD_DIR: ${{ github.workspace }}/.release-mods
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact v1.3.0 source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare executable files
        run: chmod +x gradlew tools/*.py

      - name: Stop if v1.3.0 is already published
        id: existing
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${RELEASE_TAG} already exists; leaving it untouched."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download exact required mod dependencies
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${MOD_DIR}"

          fetch_mod() {
            local url="$1"
            local name="$2"
            echo "Downloading ${name}"
            curl --fail --location --retry 4 --retry-all-errors \
              --output "${MOD_DIR}/${name}" "${url}"
            jar tf "${MOD_DIR}/${name}" >/dev/null
          }

          fetch_mod \
            "https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar" \
            "create-1.21.1-6.0.10.jar"
          fetch_mod \
            "https://cdn.modrinth.com/data/oWaK0Q19/versions/w7zlLnea/create-aeronautics-bundled-1.21.1-1.3.0.jar" \
            "create-aeronautics-bundled-1.21.1-1.3.0.jar"
          fetch_mod \
            "https://cdn.modrinth.com/data/P26k79kP/versions/EYVmBa7H/aeroworks-1.3.0.jar" \
            "aeroworks-1.3.0.jar"
          fetch_mod \
            "https://cdn.modrinth.com/data/T9PomCSv/versions/znvYZcVX/sable-neoforge-1.21.1-2.0.1.jar" \
            "sable-neoforge-1.21.1-2.0.1.jar"
          fetch_mod \
            "https://cdn.modrinth.com/data/gu7yAYhd/versions/puxJkazX/cc-tweaked-1.21.1-forge-1.119.0.jar" \
            "cc-tweaked-1.21.1-forge-1.119.0.jar"

          echo "Required dependency set:"
          ls -lh "${MOD_DIR}"

      - name: Validate repository and dependency manifest
        if: steps.existing.outputs.published != 'true'
        run: |
          python3 -m py_compile tools/*.py
          python3 tools/verify-repository.py
          python3 tools/verify-dependency-manifest.py

      - name: Run release integration profile
        if: steps.existing.outputs.published != 'true'
        run: |
          python3 tools/run-integration-profile.py BASE-SERVER \
            --dependency-dir "${MOD_DIR}" \
            --server-smoke

      - name: Inspect and hash release JAR
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          jar_path="build/libs/cc-aeroworks-1.3.0.jar"
          test -f "${jar_path}"

          unzip -p "${jar_path}" META-INF/neoforge.mods.toml > build/release-neoforge.mods.toml
          grep -F 'modId="cc_aeroworks"' build/release-neoforge.mods.toml
          grep -F 'modId="cc_aeroworks_radarcompat"' build/release-neoforge.mods.toml
          test "$(grep -Fc 'version="1.3.0"' build/release-neoforge.mods.toml)" -ge 2
          grep -A3 -F 'modId="sable"' build/release-neoforge.mods.toml | grep -F 'type="required"'

          sha256sum "${jar_path}" | tee "${jar_path}.sha256"

      - name: Prepare release notes
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          cat > build/release-notes-v1.3.0.md <<'EOF'
          # CC-Aeroworks v1.3.0

          This release expands CC-Aeroworks into a broader programmable cockpit and vehicle-control platform for Create: Aeroworks and CC:Tweaked.

          ## Highlights

          - Reworked ComputerControlDesk APIs with typed in-game documentation for peripherals, channels, controls, wires and telemetry.
          - Hierarchical ControlDesk peripheral networking with stable handles, lifecycle events and safer attach/detach cleanup.
          - Programmable small and large displays using configurable PPB-based square-pixel geometry and dynamic texture rendering.
          - Large-display touch and continuous draw input with normalized coordinates, direction/speed vectors, batched stroke samples and smoother curve reconstruction.
          - Hardened combined-input lifecycle so display/control capture is released correctly on mode changes, GUI focus changes and invalid targets.
          - Computer-driven Aeroworks control overrides for autopilot-style control authority, including batch operations and fail-safe release behavior.
          - User-defined 0..15 wire channels for optional Drive By Wire integration.
          - Structured Create telemetry, Display Link information sources, GPS support and optional docking telemetry.
          - Optional Create: Radars compatibility isolated into the separate `cc_aeroworks_radarcompat` mod entry.
          - Improved ControlDesk UI navigation, source grouping, multiblock previews and API/manual access.
          - German/English README entry point and refreshed Lua examples/documentation.

          ## Runtime baseline

          - Minecraft 1.21.1
          - NeoForge 21.1.228+
          - Create 6.0.10
          - Create Aeronautics 1.3.0
          - Create: Aeroworks 1.3.0
          - Sable 2.0.1+
          - CC:Tweaked 1.119.0 to <1.121.0

          The attached JAR is produced from commit `4573750b12223f5180775a7dd2313cc131421eb4`. The release workflow publishes only after dependency validation, unit tests, a full Gradle build, metadata inspection and a dedicated-server smoke test pass.
          EOF

      - name: Publish GitHub release
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "build/libs/cc-aeroworks-1.3.0.jar#CC-Aeroworks v1.3.0" \
            "build/libs/cc-aeroworks-1.3.0.jar.sha256#SHA-256" \
            "build/test-results/integration/base-server.json#BASE-SERVER verification result" \
            "build/release-neoforge.mods.toml#Generated NeoForge metadata" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_TARGET}" \
            --title "CC-Aeroworks v1.3.0" \
            --notes-file build/release-notes-v1.3.0.md \
            --latest

      - name: Upload release evidence
        if: always() && steps.existing.outputs.published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cc-aeroworks-v1.3.0-release-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/test-results/**
            build/reports/tests/**
            build/libs/**
            build/release-neoforge.mods.toml
            build/release-notes-v1.3.0.md
