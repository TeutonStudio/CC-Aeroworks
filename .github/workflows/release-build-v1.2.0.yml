name: Build v1.2.0

on:
  push:
    branches:
      - "release/v1.2.0"

permissions:
  contents: read

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare executable files
        run: chmod +x gradlew tools/*.py

      - name: Download public baseline mod dependencies
        shell: bash
        run: |
          set -euo pipefail
          mods="${RUNNER_TEMP}/cc-aeroworks-mods"
          mkdir -p "${mods}"

          curl --fail --location --retry 3 \
            "https://cursemaven.com/curse/maven/create-328085/7963363/create-328085-7963363.jar" \
            -o "${mods}/create-1.21.1-6.0.10.jar"
          curl --fail --location --retry 3 \
            "https://cursemaven.com/curse/maven/create-aeronautics-676721/8240058/create-aeronautics-676721-8240058.jar" \
            -o "${mods}/create-aeronautics-bundled-1.21.1-1.3.0.jar"
          curl --fail --location --retry 3 \
            "https://cursemaven.com/curse/maven/create-aeroworks-1522473/8409091/create-aeroworks-1522473-8409091.jar" \
            -o "${mods}/aeroworks-1.3.0.jar"
          curl --fail --location --retry 3 \
            "https://cursemaven.com/curse/maven/sable-1312371/8242682/sable-1312371-8242682.jar" \
            -o "${mods}/sable-neoforge-1.21.1-2.0.1.jar"
          curl --fail --location --retry 3 \
            "https://maven.squiddev.cc/cc/tweaked/cc-tweaked-1.21.1-forge/1.119.0/cc-tweaked-1.21.1-forge-1.119.0.jar" \
            -o "${mods}/cc-tweaked-1.21.1-forge-1.119.0.jar"
          curl --fail --location --retry 3 \
            "https://maven.createmod.net/dev/engine-room/flywheel/flywheel-neoforge-api-1.21.1/1.0.6/flywheel-neoforge-api-1.21.1-1.0.6.jar" \
            -o "${mods}/flywheel-neoforge-api-1.21.1-1.0.6.jar"
          curl --fail --location --retry 3 \
            "https://cursemaven.com/curse/maven/drive-by-wire-with-sable-1520378/8101676/drive-by-wire-with-sable-1520378-8101676.jar" \
            -o "${mods}/drivebywire-0.2.9.jar"

          find "${mods}" -maxdepth 1 -type f -name '*.jar' -print -exec test -s '{}' ';'
          echo "MOD_DEPENDENCY_DIR=${mods}" >> "${GITHUB_ENV}"

      - name: Verify required local mod dependencies
        run: ./gradlew -Pmod_dependency_dir="${MOD_DEPENDENCY_DIR}" verifyModDependencies --no-daemon --stacktrace

      - name: Clean, test and build v1.2.0
        run: ./gradlew -Pmod_dependency_dir="${MOD_DEPENDENCY_DIR}" clean test build --no-daemon --stacktrace

      - name: Confirm release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/cc-aeroworks-1.2.0.jar
          sha256sum build/libs/cc-aeroworks-1.2.0.jar

      - name: Upload v1.2.0 JAR
        uses: actions/upload-artifact@v7
        with:
          name: cc-aeroworks-v1.2.0
          if-no-files-found: error
          retention-days: 14
          path: build/libs/cc-aeroworks-1.2.0.jar
