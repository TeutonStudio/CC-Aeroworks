name: Inspect Aeroworks ModuleScreen

on:
  push:
    branches:
      - agent/control-settings-scroll-rows

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Inspect Aeroworks 1.3.0 ModuleScreen bytecode
        shell: bash
        run: |
          set -euo pipefail
          jar="${RUNNER_TEMP}/aeroworks-1.3.0.jar"
          curl --fail --location --retry 3 \
            --output "${jar}" \
            "https://cdn.modrinth.com/data/P26k79kP/versions/EYVmBa7H/aeroworks-1.3.0.jar"
          echo '===== SIGNATURES ====='
          javap -classpath "${jar}" -p -s \
            com.mred231.aeroworks.content.controls.ModuleScreen
          echo '===== BYTECODE ====='
          javap -classpath "${jar}" -p -c \
            com.mred231.aeroworks.content.controls.ModuleScreen
