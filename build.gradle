plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

apply from: 'gradle/dependency-validation.gradle'

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup('thedarkcolour') }
    }
    maven {
        name = 'SquidDev'
        url = 'https://maven.squiddev.cc'
        content { includeGroup('cc.tweaked') }
    }
    maven {
        name = 'CreateMaven'
        url = 'https://maven.createmod.net'
        content { includeGroup('net.createmod.ponder') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanHCode'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter { includeGroup('dev.ryanhcode.sable-companion') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup('curse.maven') }
    }
}

base {
    archivesName = 'cc-aeroworks'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        smokeServer {
            server()
            gameDirectory = project.file(
                providers.gradleProperty('smoke_server_dir').orElse('build/smoke-server').get()
            )
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}")
    compileOnly("io.github.llamalad7:mixinextras-neoforge:0.5.0")
    // Sable 2.0.1 embeds Companion 1.6.0 with jarJar. The nested JAR is available
    // at runtime, but it is not part of the Kotlin compile classpath of local mod JARs.
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:1.6.0")
    implementation fileTree(
        dir: modDependencyDirectory,
        include: ['*.jar'],
        exclude: [
            'create_radar-*.jar', 'create-radar-*.jar', 'create_radars-*.jar', 'create-radars-*.jar',
            'createdieselgenerators-*.jar', 'create-diesel-generators-*.jar',
            'createbigcannons-*.jar', 'create-big-cannons-*.jar',
            'ritchiesprojectilelib-*.jar', 'ritchies-projectile-lib-*.jar',
            'jei-*.jar'
        ]
    )
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    localRuntime("curse.maven:create-radars-1152836:${create_radars_curse_file_id}")
    localRuntime("curse.maven:create-diesel-generators-869316:${create_diesel_generators_curse_file_id}")
    localRuntime("curse.maven:create-big-cannons-646668:${create_big_cannons_curse_file_id}")
    localRuntime("curse.maven:ritchies-projectile-library-1279407:${ritchies_projectile_lib_curse_file_id}")
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            kotlin_for_forge_version: kotlin_for_forge_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
