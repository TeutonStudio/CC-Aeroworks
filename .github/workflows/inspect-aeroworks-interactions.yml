name: Inspect Aeroworks interactions

on:
  push:
    branches:
      - agent/restore-control-interactions
  pull_request:
    paths:
      - .github/workflows/inspect-aeroworks-interactions.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Aeroworks 1.3.0
        run: |
          curl --fail --location --retry 3 \
            --output aeroworks.jar \
            https://cdn.modrinth.com/data/P26k79kP/versions/EYVmBa7H/aeroworks-1.3.0.jar
          sha256sum aeroworks.jar
      - name: Inspect interaction entry points
        run: |
          javap -classpath aeroworks.jar -p -c -s com.mred231.aeroworks.content.controls.ConsoleDeskBlock
          javap -classpath aeroworks.jar -p -c -s com.mred231.aeroworks.content.controls.MountedModule
      - name: Find shift and menu triggers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            class_name="${entry%.class}"
            class_name="${class_name//\//.}"
            output="$(javap -classpath aeroworks.jar -p -c -s "$class_name" 2>/dev/null || true)"
            if grep -Eq 'isShiftKeyDown|isCrouching|MountedModule\.openMenu|ModuleMenu|openMenu:' <<<"$output"; then
              echo "===== $class_name ====="
              echo "$output"
            fi
          done < <(
            jar tf aeroworks.jar \
              | grep '^com/mred231/aeroworks/content/controls/.*\.class$' \
              | grep -v '\$' \
              | sort
          )
