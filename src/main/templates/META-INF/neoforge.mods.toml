# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/neoforged/FancyModLoader/wiki/Mod-Files

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TeutonStudio"
description='''
Adds a CC:Tweaked peripheral, desk displays, combined lever control, and optional Create: Radars displays to Create: Aeroworks.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="[${kotlin_for_forge_version},6)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.0.11)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aeroworks"
    type="required"
    versionRange="[1.3.0,1.3.1)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aeronautics"
    type="required"
    versionRange="[1.3.0,1.3.1)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[2.0.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="computercraft"
    type="required"
    versionRange="[1.119.0,1.121.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="drivebywire"
    type="optional"
    versionRange="[0.2.9,0.3)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="createbigcannons"
    type="optional"
    reason="Supplies the Create Big Cannons runtime required by Create: Radars."
    versionRange="[5.11.7,5.12)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create_radar"
    type="optional"
    reason="Enables the small and large Data Link radar displays."
    versionRange="[0.4.9.4,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="cc_aeroworks.mixins.json"
